<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>High Scores | Galaxy Blasters Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Galaxy Blasters High Scores</h1>
        <p>The best pilots at the Galaxy Blasters Arcade this week.</p>
    </header>

    <main>
        <section>
            <h2>The top 10 countdown</h2>
            <!--
                1. The top 10, as a countdown.
                   An ordered list that starts with 10th place (BLIPBOB) and ends with the winner (PIXELPAM),
                   numbered from 10 down to 1. Each item is a player and their score, such as: PIXELPAM: 98,450
                   The places and scores are in scores.txt, part 1.
            -->
        </section>

        <section>
            <h2>Scores by level</h2>
            <!--
                2. The scores table.
                   A table with the caption from scores.txt, part 2, and:
                   - a head with one row of column labels: Player, Level 1, Level 2, Level 3, Total
                   - a body with one row for each of the five players: the player's tag, then their four scores
                   - a foot with the totals row: All five, then the four totals
                   Every header cell says what it labels: scope="col" for a column, scope="row" for a row.
            -->
        </section>

        <section>
            <h2>Power-ups</h2>
            <!--
                3. The power-ups.
                   A description list: each power-up's name, then what it does.
                   The six power-ups are in scores.txt, part 3. Mega Bomb has two descriptions.
            -->
        </section>
    </main>

    <footer>
        <p>Galaxy Blasters Arcade. Scores reset every Monday at opening time.</p>
    </footer>
</body>
</html>
